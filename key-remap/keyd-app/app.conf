[google-chrome]

# Emacs-style navigation
control.n = down
control.p = up
control.a = home
control.e = end
control.h = delete
control.b = left
control.f = right
alt.b = C-left
alt.f = C-right
alt.w = C-backspace
alt.d = C-delete

# Chrome's original shortcuts moved to Alt
alt.n = C-n
alt.p = C-p
alt.a = C-a
alt.e = C-e
alt.h = C-h

# Chrome's original Ctrl+B/F moved to Alt+Shift
alt+shift.b = C-b
alt+shift.f = C-f
